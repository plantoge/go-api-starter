basePath: /api/v1
definitions:
  internal_modules_platform_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_modules_platform_auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  internal_modules_platform_auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_modules_platform_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_modules_tenant_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      tenant_code:
        type: string
    required:
    - email
    - password
    - tenant_code
    type: object
  internal_modules_tenant_auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  internal_modules_tenant_auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
      tenant_code:
        type: string
    required:
    - refresh_token
    - tenant_code
    type: object
  internal_modules_tenant_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
      tenant_code:
        type: string
    required:
    - refresh_token
    - tenant_code
    type: object
  user.CreateRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.UpdateRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
    type: object
  user.View:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
info:
  contact: {}
  description: Multi-tenant API starter — schema-per-tenant PostgreSQL. Point of Sales
    is the first thing built on it, not a fixed part of it.
  title: App API
  version: "1.0"
paths:
  /admin/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_platform_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_platform_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Admin login
      tags:
      - platform-auth
  /admin/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_platform_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Revoke an admin refresh token
      tags:
      - platform-auth
  /admin/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_platform_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_platform_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Refresh an admin access token
      tags:
      - platform-auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: tenant_code, credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_tenant_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_tenant_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Tenant staff login
      tags:
      - tenant-auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: tenant_code, refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_tenant_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Revoke a tenant refresh token
      tags:
      - tenant-auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: tenant_code, refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_tenant_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_tenant_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Refresh a tenant access token
      tags:
      - tenant-auth
  /users:
    get:
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size, max 100
        in: query
        name: limit
        type: integer
      - description: created_at, name, or email
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List tenant users
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: new user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.View'
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a tenant user
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Soft-delete a tenant user
      tags:
      - users
    get:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.View'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a tenant user by ID
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a tenant user
      tags:
      - users
swagger: "2.0"
