basePath: /api/v1
definitions:
  internal_modules_platform_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_modules_platform_auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  internal_modules_platform_auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_modules_platform_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_modules_tenant_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      tenant_code:
        type: string
    required:
    - email
    - password
    - tenant_code
    type: object
  internal_modules_tenant_auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  internal_modules_tenant_auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
      tenant_code:
        type: string
    required:
    - refresh_token
    - tenant_code
    type: object
  internal_modules_tenant_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
      tenant_code:
        type: string
    required:
    - refresh_token
    - tenant_code
    type: object
  user.CreateRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.UpdateRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
    type: object
  user.View:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
info:
  contact: {}
  description: Starter API multi-tenant — PostgreSQL dengan satu schema per tenant.
    Point of Sales cuma hal pertama yang dibangun di atasnya, bukan bagian tetap dari
    starter ini.
  title: App API
  version: "1.0"
paths:
  /admin/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: email dan password admin
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_platform_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_platform_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login admin platform
      tags:
      - platform-auth
  /admin/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token yang mau dicabut
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_platform_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Cabut refresh token admin
      tags:
      - platform-auth
  /admin/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token yang masih berlaku
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_platform_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_platform_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Perbarui access token admin
      tags:
      - platform-auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: tenant_code, email, dan password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_tenant_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_tenant_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login staf tenant
      tags:
      - tenant-auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: tenant_code dan refresh token yang mau dicabut
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_tenant_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Cabut refresh token tenant
      tags:
      - tenant-auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: tenant_code dan refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_tenant_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_tenant_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Perbarui access token tenant
      tags:
      - tenant-auth
  /users:
    get:
      parameters:
      - description: nomor halaman
        in: query
        name: page
        type: integer
      - description: jumlah data per halaman, maksimal 100
        in: query
        name: limit
        type: integer
      - description: created_at, name, atau email
        in: query
        name: sort
        type: string
      - description: asc atau desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Daftar user tenant
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: data user baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.View'
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Buat user tenant
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: id user
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Hapus user tenant (soft delete)
      tags:
      - users
    get:
      parameters:
      - description: id user
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.View'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil satu user tenant berdasarkan ID
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: id user
        in: path
        name: id
        required: true
        type: string
      - description: field yang mau diubah
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Perbarui user tenant
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
